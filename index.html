<style>

<body>
<div id="app"></div>
<script>
var WEATHER_URL="https://api.open-meteo.com/v1/forecast";
var GCAL_API="https://www.googleapis.com/calendar/v3";
var SCOPES="https://www.googleapis.com/auth/calendar";
var WMO={0:{i:"\u2600\uFE0F",l:"\u6674\u5929"},1:{i:"\uD83C\uDF24\uFE0F",l:"\u5927\u81F4\u6674\u6717"},2:{i:"\u26C5",l:"\u591A\u96F2"},3:{i:"\u2601\uFE0F",l:"\u9670\u5929"},45:{i:"\uD83C\uDF2B\uFE0F",l:"\u9727"},51:{i:"\uD83C\uDF26\uFE0F",l:"\u5C0F\u96E8"},61:{i:"\uD83C\uDF27\uFE0F",l:"\u5C0F\u96E8"},63:{i:"\uD83C\uDF27\uFE0F",l:"\u4E2D\u96E8"},65:{i:"\uD83C\uDF27\uFE0F",l:"\u5927\u96E8"},80:{i:"\uD83C\uDF26\uFE0F",l:"\u9663\u96E8"},95:{i:"\u26C8\uFE0F",l:"\u96F7\u66B4"}};
var wI=function(c){return WMO[c]||{i:"\uD83C\uDF21\uFE0F",l:"\u672A\u77E5"}};
var CL=["#b8c9e8","#e8c4c4","#c4ddb4","#e8d8b4","#d4c4e8","#b4d8d4","#e8b4c8"];
var DZ=["\u9031\u65E5","\u9031\u4E00","\u9031\u4E8C","\u9031\u4E09","\u9031\u56DB","\u9031\u4E94","\u9031\u516D"];
var MZ=["\u4E00\u6708","\u4E8C\u6708","\u4E09\u6708","\u56DB\u6708","\u4E94\u6708","\u516D\u6708","\u4E03\u6708","\u516B\u6708","\u4E5D\u6708","\u5341\u6708","\u5341\u4E00\u6708","\u5341\u4E8C\u6708"];
var FS={small:{b:12,t:13,e:12,tm:11,w:24,dn:38,tb:12,d:12,lb:10},medium:{b:14,t:14,e:14,tm:12,w:28,dn:46,tb:13,d:13,lb:11},large:{b:16,t:16,e:16,tm:14,w:32,dn:52,tb:15,d:15,lb:12}};

var S={page:"loading",clientId:null,token:null,user:null,days:3,autoMin:0,fontSize:"medium",events:null,weather:null,loading:false,error:null,lastUpdate:null,showSettings:false,showWeather:false,loc:{lat:25.033,lon:121.565,name:"\u53F0\u5317"},locLoading:false,tab:"cal",memos:[],detailId:null,showForm:false,editId:null,confirmDel:null,form:{title:"",date:"",start:"09:00",end:"10:00",organizer:"",desc:"",loc:"",allDay:false,attendees:""},saving:false};
var tmr=null,tokenClient=null;
function f(){return FS[S.fontSize]}
function tK(){return new Date().toISOString().split("T")[0]}
function fT(dt){return new Date(dt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false})}
function fD(d){return new Date(d).getMonth()+1+"/"+new Date(d).getDate()}
function iA(e){return e.start&&e.start.date&&!e.start.dateTime}

function loadMemos(){try{var d=localStorage.getItem("gcal_memos");if(d)S.memos=JSON.parse(d)}catch(e){}}
function saveMemos(){try{localStorage.setItem("gcal_memos",JSON.stringify(S.memos))}catch(e){}}
function addMemo(){var el=document.getElementById("memoInput");if(!el||!el.value.trim())return;S.memos.unshift({id:Date.now(),text:el.value.trim(),done:false});saveMemos();render()}
function toggleMemo(id){S.memos.forEach(function(m){if(m.id===id)m.done=!m.done});saveMemos();render()}
function delMemo(id){S.memos=S.memos.filter(function(m){return m.id!==id});saveMemos();render()}

function detectLoc(){if(!navigator.geolocation)return;S.locLoading=true;render();navigator.geolocation.getCurrentPosition(function(p){var lat=p.coords.latitude,lon=p.coords.longitude;fetch("https://nominatim.openstreetmap.org/reverse?lat="+lat+"&lon="+lon+"&format=json&accept-language=zh-TW").then(function(r){return r.json()}).then(function(d){S.loc={lat:lat,lon:lon,name:d.address.city||d.address.town||d.address.county||"\u76EE\u524D\u4F4D\u7F6E"};S.locLoading=false;fetchWeather().then(render)}).catch(function(){S.loc={lat:lat,lon:lon,name:"\u76EE\u524D\u4F4D\u7F6E"};S.locLoading=false;fetchWeather().then(render)})},function(){S.locLoading=false;render()},{timeout:8000})}
function fetchWeather(){return fetch(WEATHER_URL+"?latitude="+S.loc.lat+"&longitude="+S.loc.lon+"&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&current_weather=true&timezone=auto&forecast_days="+Math.max(S.days+1,4)).then(function(r){return r.json()}).then(function(d){S.weather=d}).catch(function(){S.weather=null})}

function loadGIS(){return new Promise(function(resolve){if(window.google&&window.google.accounts){resolve();return}var s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=resolve;s.onerror=function(){S.error="\u7121\u6CD5\u8F09\u5165 Google";render()};document.head.appendChild(s)})}
function initTokenClient(){tokenClient=google.accounts.oauth2.initTokenClient({client_id:S.clientId,scope:SCOPES,callback:function(resp){if(resp.error){S.error="\u767B\u5165\u5931\u6557: "+resp.error;render();return}S.token=resp.access_token;try{localStorage.setItem("gcal_token",resp.access_token)}catch(e){}fetch("https://www.googleapis.com/oauth2/v2/userinfo",{headers:{Authorization:"Bearer "+S.token}}).then(function(r){return r.json()}).then(function(u){S.user={name:u.name||"",email:u.email||"",picture:u.picture||""};try{localStorage.setItem("gcal_user",JSON.stringify(S.user))}catch(e){}S.page="main";render();fetchCalendar()}).catch(function(){S.user={name:"",email:"",picture:""};S.page="main";render();fetchCalendar()})}})}
function doLogin(){if(!tokenClient)initTokenClient();tokenClient.requestAccessToken({prompt:""})}
function doLogout(){if(S.token)google.accounts.oauth2.revoke(S.token);S.token=null;S.user=null;S.events=null;S.page="login";try{localStorage.removeItem("gcal_token");localStorage.removeItem("gcal_user")}catch(e){}render()}

function fetchCalendar(){if(!S.token)return;S.loading=true;S.error=null;render();var now=new Date();now.setHours(0,0,0,0);var end=new Date(now);end.setDate(end.getDate()+S.days);return fetch(GCAL_API+"/calendars/primary/events?timeMin="+now.toISOString()+"&timeMax="+end.toISOString()+"&singleEvents=true&orderBy=startTime&maxResults=100",{headers:{Authorization:"Bearer "+S.token}}).then(function(r){if(r.status===401){S.error=null;try{localStorage.removeItem("gcal_token")}catch(e){}if(tokenClient){tokenClient.requestAccessToken({prompt:""})}else{S.page="login";S.token=null}S.loading=false;render();return}return r.json()}).then(function(data){if(!data)return;S.events=data.items||[];S.lastUpdate=new Date();return fetchWeather()}).then(function(){S.loading=false;render()}).catch(function(e){S.error="\u8F09\u5165\u5931\u6557: "+e.message;S.loading=false;render()})}

function getDomain(){return S.user&&S.user.email?S.user.email.split("@")[1]:"gmail.com"}
function expandEmails(str){var domain=getDomain();return str.split(/[,;\s]+/).filter(Boolean).map(function(e){e=e.trim();if(e.indexOf("@")===-1)e=e+"@"+domain;return e}).join(", ")}

function createEvent(ev){S.saving=true;render();var body={summary:ev.title,description:ev.desc||"",location:ev.loc||""};if(ev.organizer)body.description="[\u767C\u8D77\u4EBA: "+ev.organizer+"]\n"+(body.description||"");if(ev.allDay){body.start={date:ev.date};body.end={date:ev.date}}else{body.start={dateTime:ev.date+"T"+ev.start+":00",timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone};body.end={dateTime:ev.date+"T"+ev.end+":00",timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}}if(ev.attendees){body.attendees=expandEmails(ev.attendees).split(/[,;\s]+/).filter(Boolean).map(function(e){return{email:e.trim()}})}return fetch(GCAL_API+"/calendars/primary/events?sendUpdates=all",{method:"POST",headers:{Authorization:"Bearer "+S.token,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(){S.saving=false;S.showForm=false;fetchCalendar()}).catch(function(e){S.error="\u65B0\u589E\u5931\u6557: "+e.message;S.saving=false;render()})}

function updateEvent(id,ev){S.saving=true;render();var body={summary:ev.title,description:ev.desc||"",location:ev.loc||""};if(ev.organizer)body.description="[\u767C\u8D77\u4EBA: "+ev.organizer+"]\n"+(body.description||"");if(ev.allDay){body.start={date:ev.date};body.end={date:ev.date}}else{body.start={dateTime:ev.date+"T"+ev.start+":00",timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone};body.end={dateTime:ev.date+"T"+ev.end+":00",timeZone:Intl.DateTimeFormat().resolvedOptions().timeZone}}if(ev.attendees){body.attendees=expandEmails(ev.attendees).split(/[,;\s]+/).filter(Boolean).map(function(e){return{email:e.trim()}})}return fetch(GCAL_API+"/calendars/primary/events/"+id+"?sendUpdates=all",{method:"PATCH",headers:{Authorization:"Bearer "+S.token,"Content-Type":"application/json"},body:JSON.stringify(body)}).then(function(r){return r.json()}).then(function(){S.saving=false;S.showForm=false;S.detailId=null;fetchCalendar()}).catch(function(e){S.error="\u66F4\u65B0\u5931\u6557: "+e.message;S.saving=false;render()})}

function deleteEvent(id){S.saving=true;render();return fetch(GCAL_API+"/calendars/primary/events/"+id+"?sendUpdates=all",{method:"DELETE",headers:{Authorization:"Bearer "+S.token}}).then(function(){S.saving=false;S.detailId=null;S.confirmDel=null;fetchCalendar()}).catch(function(e){S.error="\u522A\u9664\u5931\u6557: "+e.message;S.saving=false;render()})}

function saveForm(){if(!S.form.title.trim())return;if(S.editId){updateEvent(S.editId,S.form)}else{createEvent(S.form)}}
function setupTimer(){if(tmr)clearInterval(tmr);if(S.autoMin>0)tmr=setInterval(fetchCalendar,S.autoMin*60000)}
function groupByDate(evts,days){var g={},t=new Date();for(var i=0;i<days;i++){var d=new Date(t);d.setDate(d.getDate()+i);g[d.toISOString().split("T")[0]]=[]}for(var j=0;j<evts.length;j++){var e=evts[j],s=(e.start&&(e.start.dateTime||e.start.date))||"",k=s.substring(0,10);if(g[k])g[k].push(e)}for(var key in g)g[key].sort(function(a,b){if(iA(a)&&!iA(b))return-1;if(!iA(a)&&iA(b))return 1;return((a.start&&a.start.dateTime)||"").localeCompare((b.start&&b.start.dateTime)||"")});return g}

function getOrg(evt){var d=evt.description||"";var m=d.match(/\[\u767C\u8D77\u4EBA:\s*(.+?)\]/);return m?m[1]:(evt.organizer&&evt.organizer.displayName?evt.organizer.displayName:"")}
function getDesc(evt){return(evt.description||"").replace(/\[\u767C\u8D77\u4EBA:.+?\]\n?/,"")}
function getAttendees(evt){return(evt.attendees||[]).map(function(a){return a.email}).join(", ")}

function openNew(){S.editId=null;var orgName="";if(S.user){orgName=S.user.name||S.user.email||""}S.form={title:"",date:tK(),start:"09:00",end:"10:00",organizer:orgName,desc:"",loc:"",allDay:false,attendees:""};S.showForm=true;render()}
function openDetail(id){S.detailId=id;S.confirmDel=null;render()}
function openEdit(evt){S.editId=evt.id;var sd=evt.start.dateTime?evt.start.dateTime.substring(0,10):(evt.start.date||tK());var st=evt.start.dateTime?fT(evt.start.dateTime):"09:00";var et=evt.end&&evt.end.dateTime?fT(evt.end.dateTime):"10:00";S.form={title:evt.summary||"",date:sd,start:st,end:et,organizer:getOrg(evt),desc:getDesc(evt),loc:evt.location||"",allDay:iA(evt),attendees:getAttendees(evt)};S.showForm=true;S.detailId=null;render()}

function render(){var app=document.getElementById("app"),fs=f();
