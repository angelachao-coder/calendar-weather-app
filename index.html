<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="行事曆助手">
<meta name="theme-color" content="#FAFAF8">
<title>行事曆天氣助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,'Noto Sans TC','Helvetica Neue',sans-serif;background:#FAFAF8;color:#2d2d2d;max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);overscroll-behavior:none}
button{font-family:inherit;border:none;cursor:pointer;-webkit-appearance:none}
::-webkit-scrollbar{display:none}
.header{display:flex;justify-content:space-between;align-items:flex-start;padding:28px 20px 0}
.date-num{font-size:46px;font-weight:200;color:#1a1a1a;line-height:1;letter-spacing:-2px}
.date-sub{font-size:13px;color:#aaa;margin-top:4px;letter-spacing:.5px}
.top-right{display:flex;align-items:center;gap:8px;margin-top:6px}
.avatar{width:32px;height:32px;border-radius:50%;border:2px solid #f0eeeb;object-fit:cover}
.sb{width:38px;height:38px;border-radius:50%;border:1px solid #e8e8e5;background:#fff;display:flex;align-items:center;justify-content:center;font-size:17px;color:#999;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.sb:active{transform:scale(.92)}
.sp{margin:14px 20px 0;background:#fff;border-radius:18px;padding:22px;border:1px solid #f0eeeb;box-shadow:0 2px 12px rgba(0,0,0,.03);animation:sd .25s ease}
@keyframes sd{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
.sl{font-size:11px;color:#aaa;font-weight:600;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
.sl:not(:first-child){margin-top:18px}
.srow{display:flex;gap:6px}
.sbt{flex:1;padding:10px 0;border-radius:10px;font-size:13px;color:#999;background:#FAFAF8;border:1px solid #eee}
.sbt.a{background:#1a1a1a;color:#fff;border-color:#1a1a1a;font-weight:500}
.sbt:active{transform:scale(.96)}
.wb{margin:20px 20px 0;padding:18px 20px;background:#fff;border-radius:18px;border:1px solid #f0eeeb;box-shadow:0 1px 6px rgba(0,0,0,.03)}
.wb:active{transform:scale(.985)}
.wt{display:flex;justify-content:space-between;align-items:center}
.wl{display:flex;align-items:center;gap:14px}
.wi{font-size:36px}
.wtp{font-size:28px;font-weight:200;color:#1a1a1a}
.wds{font-size:12px;color:#bbb;margin-top:1px}
.wp{display:inline-block;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:500}
.wtg{font-size:11px;color:#ccc;text-align:center;margin-top:10px}
.wdt{margin:0 20px;background:#fff;border-radius:0 0 18px 18px;border:1px solid #f0eeeb;border-top:1px dashed #f5f4f1;padding:16px 12px;animation:sd .2s ease}
.frow{display:flex;gap:2px}
.fd{text-align:center;flex:1;padding:8px 2px}
.fdl{font-size:11px;color:#bbb}
.fdl.today{color:#1a1a1a;font-weight:600}
.fdi{font-size:22px;margin:6px 0}
.fdm{font-size:12px;font-weight:500;color:#555}
.fdn{font-size:11px;color:#ccc}
.fdr{font-size:10px;color:#a8c8e8;margin-top:3px}
.ev{padding:0 20px}
.dlab{font-size:13px;font-weight:600;color:#1a1a1a;margin-top:24px;margin-bottom:10px;letter-spacing:.5px}
.ec{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;border:1px solid #f0eeeb;box-shadow:0 1px 3px rgba(0,0,0,.02);display:flex;align-items:center;gap:12px}
.ec:active{transform:scale(.98)}
.ebar{width:3px;height:30px;border-radius:2px;flex-shrink:0}
.etit{font-size:14px;font-weight:500;color:#2d2d2d;line-height:1.4}
.etm{font-size:12px;color:#bbb;margin-top:2px}
.eloc{font-size:12px;color:#b8c9e8;margin-top:1px}
.emp{font-size:13px;color:#ddd;font-style:italic;padding:10px 0}
.ft{text-align:center;font-size:11px;color:#ccc;padding:20px 0 32px}
.login-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:85vh;padding:40px 30px;text-align:center}
.login-icon{font-size:64px;margin-bottom:20px}
.login-title{font-size:24px;font-weight:300;color:#1a1a1a;margin-bottom:8px}
.login-desc{font-size:14px;color:#aaa;line-height:1.6;margin-bottom:36px;max-width:280px}
.g-btn{display:flex;align-items:center;gap:12px;padding:14px 28px;background:#fff;border:1px solid #e0e0e0;border-radius:14px;font-size:15px;font-weight:500;color:#3c4043;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.g-btn:active{transform:scale(.97)}
.g-btn svg{width:20px;height:20px}
.user-bar{margin:16px 20px 0;padding:12px 16px;background:#fff;border-radius:14px;border:1px solid #f0eeeb;display:flex;align-items:center;gap:10px;font-size:13px}
.user-bar .nm{flex:1;font-weight:500;color:#2d2d2d}
.user-bar .lo{font-size:12px;color:#bbb;padding:4px 10px;border-radius:8px;background:#fafaf8;border:1px solid #eee}
.rb{display:block;margin:22px 20px 0;padding:15px;border-radius:14px;color:#fff;font-size:14px;font-weight:500;width:calc(100% - 40px);background:#1a1a1a}
.rb:active{transform:scale(.97);opacity:.85}
.rb:disabled{opacity:.4}
.err{margin:12px 20px 0;padding:12px 16px;background:#fff5f5;border-radius:12px;font-size:13px;color:#e88}
.ph{text-align:center;padding:40px 0;color:#ddd}
.phi{font-size:40px;margin-bottom:8px}
.pht{font-size:13px}
.setup-box{margin:20px;padding:24px;background:#fff;border-radius:18px;border:1px solid #f0eeeb}
.setup-box h3{font-size:15px;font-weight:600;margin-bottom:12px}
.setup-box ol{padding-left:20px;font-size:13px;color:#666;line-height:2.2}
.setup-box a{color:#6366f1}
.cid-input{width:100%;padding:12px 14px;border:1px solid #e8e8e5;border-radius:10px;font-size:12px;margin:12px 0;outline:none;font-family:monospace;background:#FAFAF8}
.cid-input:focus{border-color:#1a1a1a}
.cid-save{padding:12px 24px;background:#1a1a1a;color:#fff;border-radius:10px;font-size:14px;font-weight:500;width:100%}
</style>
</head>
<body>
<div id="app"></div>
<script>
var WEATHER_URL = "https://api.open-meteo.com/v1/forecast";
var GCAL_API = "https://www.googleapis.com/calendar/v3";
var SCOPES = "https://www.googleapis.com/auth/calendar.readonly";

var WMO = {
  0:{i:"☀️",l:"晴天"},1:{i:"🌤️",l:"大致晴朗"},2:{i:"⛅",l:"多雲"},3:{i:"☁️",l:"陰天"},
  45:{i:"🌫️",l:"霧"},48:{i:"🌫️",l:"霧凇"},51:{i:"🌦️",l:"小毛雨"},53:{i:"🌦️",l:"中毛雨"},
  55:{i:"🌧️",l:"大毛雨"},61:{i:"🌧️",l:"小雨"},63:{i:"🌧️",l:"中雨"},65:{i:"🌧️",l:"大雨"},
  71:{i:"🌨️",l:"小雪"},73:{i:"🌨️",l:"中雪"},75:{i:"❄️",l:"大雪"},
  80:{i:"🌦️",l:"陣雨"},81:{i:"🌧️",l:"中陣雨"},82:{i:"⛈️",l:"大陣雨"},
  95:{i:"⛈️",l:"雷暴"},96:{i:"⛈️",l:"雷暴+冰雹"},99:{i:"⛈️",l:"強雷暴+冰雹"}
};
var wI = function(c) { return WMO[c] || {i:"🌡️",l:"未知"}; };
var CL = ["#b8c9e8","#e8c4c4","#c4ddb4","#e8d8b4","#d4c4e8","#b4d8d4","#e8b4c8","#c4c8e8","#d8e8b4","#b4c4d8"];
var DZ = ["週日","週一","週二","週三","週四","週五","週六"];
var MZ = ["一月","二月","三月","四月","五月","六月","七月","八月","九月","十月","十一月","十二月"];

var S = {
  page: "loading", clientId: null, token: null, user: null,
  days: 3, autoMin: 0, events: null, weather: null,
  loading: false, error: null, lastUpdate: null,
  showSettings: false, showWeather: false,
  loc: {lat:25.033, lon:121.565, name:"台北"}, locLoading: false
};
var tmr = null, tokenClient = null;

function fT(dt) { return new Date(dt).toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",hour12:false}); }
function fD(d) { return new Date(d).getMonth()+1 + "/" + new Date(d).getDate(); }
function iA(e) { return e.start && e.start.date && !e.start.dateTime; }
function tK() { return new Date().toISOString().split("T")[0]; }

/* ===== 定位 ===== */
function detectLoc() {
  if (!navigator.geolocation) return;
  S.locLoading = true; render();
  navigator.geolocation.getCurrentPosition(function(p) {
    var lat = p.coords.latitude, lon = p.coords.longitude;
    fetch("https://nominatim.openstreetmap.org/reverse?lat="+lat+"&lon="+lon+"&format=json&accept-language=zh-TW")
      .then(function(r){return r.json()})
      .then(function(d){
        S.loc = {lat:lat, lon:lon, name: d.address.city||d.address.town||d.address.county||"目前位置"};
        S.locLoading = false; fetchWeather().then(render);
      }).catch(function(){
        S.loc = {lat:lat, lon:lon, name:"目前位置"};
        S.locLoading = false; fetchWeather().then(render);
      });
  }, function(){ S.locLoading=false; render(); }, {timeout:8000});
}

/* ===== 天氣 ===== */
function fetchWeather() {
  return fetch(WEATHER_URL+"?latitude="+S.loc.lat+"&longitude="+S.loc.lon
    +"&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max"
    +"&current_weather=true&timezone=auto&forecast_days="+Math.max(S.days+1,4))
    .then(function(r){return r.json()})
    .then(function(d){S.weather=d})
    .catch(function(){S.weather=null});
}

/* ===== Google 登入 ===== */
function loadGIS() {
  return new Promise(function(resolve) {
    if (window.google && window.google.accounts) { resolve(); return; }
    var s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.onload = resolve;
    s.onerror = function(){ S.error="無法載入 Google 登入服務"; render(); };
    document.head.appendChild(s);
  });
}

function initTokenClient() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: S.clientId,
    scope: SCOPES,
    callback: function(resp) {
      if (resp.error) { S.error="登入失敗: "+resp.error; render(); return; }
      S.token = resp.access_token;
      fetch("https://www.googleapis.com/oauth2/v2/userinfo",{headers:{Authorization:"Bearer "+S.token}})
        .then(function(r){return r.json()})
        .then(function(u){
          S.user = {name:u.name, email:u.email, picture:u.picture};
          S.page = "main"; render(); fetchCalendar();
        }).catch(function(){ S.page="main"; render(); fetchCalendar(); });
    }
  });
}

function doLogin() {
  if (!tokenClient) initTokenClient();
  tokenClient.requestAccessToken({prompt:"consent"});
}

function doLogout() {
  if (S.token) google.accounts.oauth2.revoke(S.token);
  S.token=null; S.user=null; S.events=null; S.page="login"; render();
}

/* ===== 行事曆 ===== */
function fetchCalendar() {
  if (!S.token) return;
  S.loading=true; S.error=null; render();
  var now=new Date(), end=new Date(now);
  end.setDate(end.getDate()+S.days);
  return fetch(GCAL_API+"/calendars/primary/events?timeMin="+now.toISOString()
    +"&timeMax="+end.toISOString()+"&singleEvents=true&orderBy=startTime&maxResults=100",
    {headers:{Authorization:"Bearer "+S.token}})
    .then(function(r){
      if(r.status===401){S.error="登入已過期，請重新登入";S.page="login";S.token=null;S.loading=false;render();return;}
      return r.json();
    }).then(function(data){
      if(!data)return;
      S.events=data.items||[]; S.lastUpdate=new Date();
      return fetchWeather();
    }).then(function(){S.loading=false;render()})
    .catch(function(e){S.error="載入失敗: "+e.message;S.loading=false;render();});
}

function setupTimer(){if(tmr)clearInterval(tmr);if(S.autoMin>0)tmr=setInterval(fetchCalendar,S.autoMin*60000);}

function groupByDate(evts,days){
  var g={},t=new Date();
  for(var i=0;i<days;i++){var d=new Date(t);d.setDate(d.getDate()+i);g[d.toISOString().split("T")[0]]=[];}
  for(var j=0;j<evts.length;j++){var e=evts[j],s=(e.start&&(e.start.dateTime||e.start.date))||"",k=s.substring(0,10);if(g[k])g[k].push(e);}
  for(var key in g)g[key].sort(function(a,b){if(iA(a)&&!iA(b))return-1;if(!iA(a)&&iA(b))return 1;return((a.start&&a.start.dateTime)||"").localeCompare((b.start&&b.start.dateTime)||"");});
  return g;
}

/* ===== 畫面 ===== */
function render(){
  var app=document.getElementById("app");

  // === 載入中 ===
  if(S.page==="loading"){
    app.innerHTML='<div class="login-screen"><div class="login-icon">⏳</div><div class="login-title">載入中...</div></div>';
    return;
  }

  // === 設定 Client ID ===
  if(S.page==="setup"){
    app.innerHTML='<div style="padding:20px">'
      +'<div style="text-align:center;padding:30px 0 20px">'
      +'<div style="font-size:48px;margin-bottom:12px">🔧</div>'
      +'<div style="font-size:22px;font-weight:300">初始設定</div>'
      +'<div style="font-size:13px;color:#aaa;margin-top:6px">需要 Google OAuth Client ID</div></div>'
      +'<div class="setup-box"><h3>📋 如何取得 Client ID</h3><ol>'
      +'<li>前往 <a href="https://console.cloud.google.com/apis/credentials" target="_blank">Google Cloud Console</a></li>'
      +'<li>建立專案並啟用 <strong>Google Calendar API</strong></li>'
      +'<li>建立 <strong>OAuth 2.0 Client ID</strong>（網頁應用程式）</li>'
      +'<li>在「已授權 JavaScript 來源」加入本網址</li>'
      +'<li>複製 Client ID 貼到下方</li></ol>'
      +'<input class="cid-input" id="cidInput" placeholder="貼上 Client ID (xxx.apps.googleusercontent.com)">'
      +'<button class="cid-save" onclick="saveClientId()">儲存並繼續</button></div>'
      +(S.error?'<div class="err">⚠️ '+S.error+'</div>':'')
      +'</div>';
    return;
  }

  // === 登入頁 ===
  if(S.page==="login"){
    app.innerHTML='<div class="login-screen">'
      +'<div class="login-icon">📅</div>'
      +'<div class="login-title">行事曆天氣助手</div>'
      +'<div class="login-desc">登入 Google 帳號後即可查看行事曆與天氣預報</div>'
      +'<button class="g-btn" onclick="doLogin()">'
      +'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/>'
      +'<path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>'
      +'<path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>'
      +'<path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>'
      +'使用 Google 帳號登入</button>'
      +'<div style="margin-top:24px;font-size:12px;color:#ccc">'
      +'<span style="cursor:pointer;text-decoration:underline" onclick="S.page=\'setup\';S.error=null;render()">重新設定 Client ID</span></div>'
      +(S.error?'<div class="err" style="margin-top:16px">⚠️ '+S.error+'</div>':'')
      +'</div>';
    return;
  }

  // === 主畫面 ===
  var tk=tK(), td=new Date(), cw=S.weather&&S.weather.current_weather;
  var tw=S.weather&&S.weather.daily?{
    code:S.weather.daily.weathercode[0], max:S.weather.daily.temperature_2m_max[0],
    min:S.weather.daily.temperature_2m_min[0], rain:S.weather.daily.precipitation_probability_max[0],
    uv:S.weather.daily.uv_index_max?S.weather.daily.uv_index_max[0]:0
  }:null;
  var grouped=S.events?groupByDate(S.events,S.days):null;
  var h='';

  // Header
  h+='<div class="header"><div><div class="date-num">'+td.getDate()+'</div>'
    +'<div class="date-sub">'+MZ[td.getMonth()]+' · '+DZ[td.getDay()]+'</div></div>'
    +'<div class="top-right">'+(S.user&&S.user.picture?'<img class="avatar" src="'+S.user.picture+'" referrerpolicy="no-referrer">':'')
    +'<button class="sb" onclick="toggleKey(\'showSettings\')">'+(S.showSettings?'✕':'⚙')+'</button></div></div>';

  // User bar
  if(S.user) h+='<div class="user-bar"><span class="nm">'+(S.user.name||S.user.email)+'</span><button class="lo" onclick="doLogout()">登出</button></div>';

  // Settings
  if(S.showSettings){
    h+='<div class="sp"><div class="sl">顯示天數</div><div class="srow">';
    [1,3,5,7].forEach(function(d){h+='<button class="sbt '+(S.days===d?"a":"")+'" onclick="setDays('+d+')">'+d+'天</button>';});
    h+='</div><div class="sl">自動更新</div><div class="srow">';
    [{v:0,l:"關閉"},{v:15,l:"15 分"},{v:30,l:"30 分"},{v:60,l:"1 小時"}].forEach(function(o){
      h+='<button class="sbt '+(S.autoMin===o.v?"a":"")+'" onclick="setAuto('+o.v+')">'+o.l+'</button>';
    });
    h+='</div><div class="sl">位置</div><div style="display:flex;align-items:center;gap:8px;margin-top:8px">'
      +'<span style="font-size:13px;color:#666">'+(S.locLoading?'定位中...':'📍 '+S.loc.name)+'</span>'
      +'<button style="padding:6px 14px;border-radius:8px;border:1px solid #eee;background:#fff;font-size:12px;color:#999" onclick="detectLoc()">重新定位</button></div></div>';
  }

  // Weather
  var wIcon=cw?wI(cw.weathercode).i:tw?wI(tw.code).i:'🌡️';
  var wTemp=cw?Math.round(cw.temperature)+'°':tw?Math.round(tw.max)+'°':'—';
  var wLabel=cw?wI(cw.weathercode).l:tw?wI(tw.code).l:'';
  h+='<div class="wb" onclick="toggleKey(\'showWeather\')"><div class="wt"><div class="wl"><span class="wi">'+wIcon+'</span>'
    +'<div><div class="wtp">'+wTemp+'</div><div class="wds">'+wLabel+' · '+S.loc.name+'</div></div></div>'
    +'<div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">'
    +(tw?'<span class="wp" style="background:#f0f7ff;color:#7ba7d4">💧 '+tw.rain+'%</span>':'')
    +(tw&&tw.uv>=6?'<span class="wp" style="background:#fff8ee;color:#d4a54a">UV '+Math.round(tw.uv)+'</span>':'')
    +'</div></div><div class="wtg">'+(S.showWeather?'收起預報 ▲':'展開多日預報 ▼')+'</div></div>';

  // Forecast detail
  if(S.showWeather&&S.weather&&S.weather.daily){
    var wd=S.weather.daily;
    h+='<div class="wdt"><div class="frow">';
    wd.time.slice(0,Math.min(S.days+1,7)).forEach(function(d,i){
      var info=wI(wd.weathercode[i]), isT=d===tk;
      h+='<div class="fd"><div class="fdl '+(isT?'today':'')+'">'+(isT?'今天':fD(d))+'</div>'
        +'<div class="fdi">'+info.i+'</div><div class="fdm">'+Math.round(wd.temperature_2m_max[i])+'°</div>'
        +'<div class="fdn">'+Math.round(wd.temperature_2m_min[i])+'°</div>'
        +'<div class="fdr">'+wd.precipitation_probability_max[i]+'%</div></div>';
    });
    h+='</div></div>';
  }

  // Refresh button
  h+='<button class="rb" onclick="fetchCalendar()" '+(S.loading?'disabled':'')+'>'
    +(S.loading?'同步行事曆中 ...':'🔄 同步行事曆')+'</button>';

  if(S.error) h+='<div class="err">⚠️ '+S.error+'</div>';

  // Events
  h+='<div class="ev">';
  if(!S.events&&!S.loading) h+='<div class="ph"><div class="phi">✦</div><div class="pht">點擊上方按鈕同步行程</div></div>';
  if(grouped){
    Object.keys(grouped).forEach(function(date,di){
      var evts=grouped[date], isT=date===tk, d=new Date(date);
      var label=isT?"Today":(d.getMonth()+1)+"/"+d.getDate()+" "+DZ[d.getDay()];
      h+='<div class="dlab">'+label+'</div>';
      if(!evts.length) h+='<div class="emp">沒有行程</div>';
      else evts.forEach(function(evt,i){
        var title=evt.summary||'（無標題）', ad=iA(evt);
        var st=evt.start&&evt.start.dateTime, et=evt.end&&evt.end.dateTime;
        var c=CL[(di*3+i)%CL.length];
        h+='<div class="ec"><div class="ebar" style="background:'+c+'"></div><div style="flex:1">'
          +'<div class="etit">'+title+'</div>'
          +'<div class="etm">'+(ad?'整天':st?fT(st)+(et?' – '+fT(et):''):'')+'</div>'
          +(evt.location?'<div class="eloc">📍 '+evt.location+'</div>':'')
          +'</div></div>';
      });
    });
  }
  h+='</div>';

  // Footer
  if(S.lastUpdate) h+='<div class="ft">最後同步 '+S.lastUpdate.toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit"})
    +(S.autoMin>0?' · 每 '+S.autoMin+' 分鐘自動更新':'')+'</div>';

  app.innerHTML = h;
}

/* ===== 工具函式 ===== */
function toggleKey(k) { S[k]=!S[k]; render(); }
function setDays(d) { S.days=d; if(S.token) fetchCalendar(); else render(); }
function setAuto(v) { S.autoMin=v; setupTimer(); render(); }

function saveClientId() {
  var el = document.getElementById("cidInput");
  var v = el ? el.value.trim() : "";
  if (!v || v.indexOf(".apps.googleusercontent.com") === -1) {
    S.error = "請輸入有效的 Client ID"; render(); return;
  }
  S.clientId = v;
  try { localStorage.setItem("gcal_cid", v); } catch(e) {}
  S.error = null; S.page = "login";
  loadGIS().then(function(){ initTokenClient(); render(); });
}

/* ===== 初始化 ===== */
function init() {
  try { S.clientId = localStorage.getItem("gcal_cid"); } catch(e) {}
  if (!S.clientId) { S.page = "setup"; render(); return; }
  S.page = "login";
  loadGIS().then(function(){ initTokenClient(); render(); });
  detectLoc();
  fetchWeather().then(render);
}

init();
</script>
